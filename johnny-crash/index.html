<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Johnny Crash: Stuntman Does Texas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: #0a0a1a;
            font-family: Arial, sans-serif;
            color: #fff;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .game-box {
            width: 520px;
            height: 485px;
            max-width: 100vw;
            max-height: 100vh;
            background: #000;
            border: 3px solid #ffd700;
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            position: relative;
        }
        .game-box > div {
            width: 100%;
            height: 100%;
        }
        .cheat-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 6px 14px;
            background: rgba(0,0,0,0.8);
            border: 2px solid #ffd700;
            border-radius: 16px;
            color: #ffd700;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }
        .cheat-btn.active {
            background: #2e7d32;
            border-color: #4caf50;
            color: #fff;
        }
        .cheat-btn.active::before {
            content: "✓ ";
        }
        .tip {
            margin-top: 12px;
            font-size: 13px;
            color: #888;
            text-align: center;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffd700;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
            z-index: 5;
            text-align: center;
        }
        .loading small {
            display: block;
            margin-top: 8px;
            font-size: 11px;
            color: #999;
            font-weight: normal;
        }
        .cdn-info {
            position: fixed;
            bottom: 4px;
            left: 4px;
            font-size: 10px;
            color: #666;
            background: rgba(0,0,0,0.5);
            padding: 2px 6px;
            border-radius: 3px;
            z-index: 100;
        }
    </style>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.RufflePlayer.config = {
            autoplay: "on",
            backgroundColor: "#000000",
            quality: "high",
            letterbox: "on"
        };

        // ===== CDN 多源自动切换 =====
        var cdnList = [
            'https://unpkg.com/@ruffle-rs/ruffle@0.6.0/ruffle.js',
            'https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle@0.6.0/ruffle.js',
            'https://cdnjs.cloudflare.com/ajax/libs/ruffle/0.6.0/ruffle.js',
            'https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle/ruffle.js'  // 最新版兜底
        ];
        var currentCdn = 0;
        var loadTimer = null;

        function loadRuffle() {
            if (currentCdn >= cdnList.length) {
                // 所有 CDN 都失败了
                document.getElementById('loading').innerHTML = '加载失败<br><small>所有 CDN 源都无法访问，请检查网络</small>';
                return;
            }
            var url = cdnList[currentCdn];
            document.getElementById('loading').innerHTML = '加载模拟器中...<small>正在尝试：' + url.split('/')[2] + '</small>';

            var script = document.createElement('script');
            script.src = url;
            script.onerror = function() {
                // 这个 CDN 失败了，试下一个
                currentCdn++;
                clearTimeout(loadTimer);
                loadRuffle();
            };
            script.onload = function() {
                clearTimeout(loadTimer);
                if (window.RufflePlayer && typeof window.RufflePlayer.newest === 'function') {
                    startGame();
                } else {
                    // 加载了但初始化有问题，试下一个
                    currentCdn++;
                    loadRuffle();
                }
            };
            document.head.appendChild(script);

            // 8 秒超时，换下一个
            loadTimer = setTimeout(function() {
                currentCdn++;
                loadRuffle();
            }, 8000);
        }

        function startGame() {
            // 显示用了哪个 CDN
            var cdnHost = cdnList[currentCdn].split('/')[2];
            document.querySelector('.cdn-info').textContent = 'Ruffle: ' + cdnHost;

            var ruffle = window.RufflePlayer.newest();
            var player = ruffle.createPlayer();
            player.style.width = '100%';
            player.style.height = '100%';
            document.getElementById('swfContainer').appendChild(player);

            var swfFile = infiniteEnergy ? 'johnny-crash-hacked.swf' : 'johnny-crash.swf';
            player.load(swfFile).then(function() {
                document.getElementById('loading').style.display = 'none';
            }).catch(function(err) {
                document.getElementById('loading').innerHTML = '游戏加载失败<br><small>' + (err.message || err) + '</small>';
            });
        }
    </script>
</head>
<body>
    <div class="game-box">
        <div class="loading" id="loading">准备中...</div>
        <div id="swfContainer"></div>
    </div>
    <div class="tip">
        <p>鼠标左键 / 空格键 发射 &nbsp;|&nbsp; 按住获得升力</p>
        <div class="cheat-btn" id="cheatBtn">⚡ 无限精力</div>
    </div>
    <div class="cdn-info" id="cdnInfo"></div>

    <script>
    // 无限精力切换
    var infiniteEnergy = localStorage.getItem('jc_infinite') === '1';
    var cheatBtn = document.getElementById('cheatBtn');
    if (infiniteEnergy) cheatBtn.classList.add('active');

    cheatBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        infiniteEnergy = !infiniteEnergy;
        cheatBtn.classList.toggle('active', infiniteEnergy);
        localStorage.setItem('jc_infinite', infiniteEnergy ? '1' : '0');
        window.location.reload();
    });

    // 页面加载完成后开始加载 Ruffle
    window.onload = function() {
        loadRuffle();
    };
    </script>
</body>
</html>
